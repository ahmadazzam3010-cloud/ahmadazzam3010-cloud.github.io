<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        body {
            background-color: #000000;
            color: #000000; /* Completely invisible text until highlighted */
            font-family: monospace;
            padding: 40px;
            user-select: text;
        }
        .decoy-error {
            color: #555555; /* Looks like a generic server crash message */
            font-size: 14px;
        }
        .payload {
            margin-top: 50px;
            /* Matches the exact black background so it's hidden */
            background-color: #000000; 
            color: #000000;
        }
        /* When highlighted via Ctrl+A, text turns bright green */
        ::selection {
            background: #00ff66;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="decoy-error">
        Error 503: Service temporarily unavailable. Stream node unresponsive.
    </div>

    <!-- Hidden payload revealed only on Ctrl + A selection -->
    <div class="payload">
        [INTERCEPTED STREAM DATA]
        HEX_PAYLOAD: 5A 5A 59 2D 53 52 31
        TARGET_NODE: clue2_target.png
    </div>
</body>
</html>
